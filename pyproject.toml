[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2" ]

[project]
name = "pydjantic"
version = "2.0.0"
description = "Pydantic Settings for Django"
readme = "README.md"
keywords = [ "django", "pydantic", "PydanticSettings", "settings" ]
license = "MIT"
license-files = [
    "LICENSE",
]
maintainers = [
    { name = "Vladimir Vyazovetskov", email = "erhosen@gmail.com" },
]

authors = [
    { name = "Vladimir Vyazovetskov", email = "erhosen@gmail.com" },
    { name = "Andrey Lepekhin", email = "35651221+andrey-lepekhin@users.noreply.github.com" },
    { name = "worldworm", email = "13227454+worldworm@users.noreply.github.com" },
    { name = "Thomas Grainger", email = "tagrain@gmail.com" },
    { name = "Enrico Stahn", email = "enrico.stahn@gmail.com" },
    { name = "Aurel", email = "megnigbetoa@gmail.com" },
    { name = "q0w", email = "43147888+q0w@users.noreply.github.com" },
    { name = "Nikolay", email = "liber12@mail.ru" },
    { name = "Chloe Shetreet", email = "CourteousCoder@gmail.com" },
]
requires-python = ">=3.9,<3.13"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "dj-database-url (>=2.1.0,<2.2.0)",
    "pydantic (>=2.5.2,<3.0)",
    "pydantic-settings (>=2.1,<3.0)"
]

urls.homepage = "https://github.com/ErhoSen/pydjantic"
urls.repository = "https://github.com/ErhoSen/pydjantic"

[dependency-groups]
dev = [
    "deepdiff (>=5.8.1,<6.0)",
    "pre-commit (>=2.11.1,<3.0)",
    "pytest (>=6.2.2,<7.0)",
    "pytest-cov (>=2.11.1,<3)",
    "tempenv (>=2.1.0,<3.0)"
]

[tool.ruff]
line-length = 110
lint.ignore = ["E203"]
# skip-string-normalization
format.quote-style = "preserve"
